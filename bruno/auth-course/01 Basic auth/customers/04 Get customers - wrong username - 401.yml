info:
  name: 04 Get customers - wrong username - 401
  type: http
  seq: 4

http:
  method: GET
  url: "{{server}}/api/v1/customer"
  headers:
    - name: Authorization
      value: Basic {{wrongUsernameBasicToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.status).to.equal(401);
        expect(res.headers['www-authenticate']).to.equal('Basic realm="course-api"');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
