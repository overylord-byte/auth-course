info:
  name: 05 Get customers - wrong password - 401
  type: http
  seq: 5

http:
  method: GET
  url: "{{server}}/api/v1/customer"
  headers:
    - name: Authorization
      value: Basic {{wrongPasswordBasicToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.status).to.equal(401);
        expect(res.headers['www-authenticate']).to.equal('Basic realm="course-api", charset="UTF-8"');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
