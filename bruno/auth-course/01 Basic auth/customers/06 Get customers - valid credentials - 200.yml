info:
  name: 06 Get customers - valid credentials - 200
  type: http
  seq: 6

http:
  method: GET
  url: "{{server}}/api/v1/customer"
  headers:
    - name: Authorization
      value: Basic {{validBasicToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: expect(res.status).to.equal(200);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
