info:
  name: 01 Login - valid credentials - 200
  type: http
  seq: 1

http:
  method: POST
  url: "{{server}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.status).to.equal(200);
        const setCookie = res.headers['set-cookie'] ?? res.headers['Set-Cookie'];
        expect(setCookie).to.exist;
        const joined = Array.isArray(setCookie) ? setCookie.join('; ') : String(setCookie);
        expect(joined.toLowerCase()).to.include('session_id');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
