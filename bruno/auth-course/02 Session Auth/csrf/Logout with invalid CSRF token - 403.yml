info:
  name: Logout with invalid CSRF token - 403
  type: http
  seq: 3

http:
  method: POST
  url: "{{server}}/api/v1/auth/logout"
  headers:
    - name: X-CSRF-Token
      value: Random
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: expect(res.status).to.equal(403);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
