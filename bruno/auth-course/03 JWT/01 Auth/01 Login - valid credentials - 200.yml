info:
  name: 01 Login - valid credentials - 200
  type: http
  seq: 1

http:
  method: POST
  url: "{{server}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        expect(res.status).to.equal(200);
        const body = res.getBody();
        expect(body.accessToken).to.exist;
        expect(body.tokenType).to.equal('Bearer');
        expect(body.expiresIn).to.equal(900);
        bru.setVar('jwtAccessToken', body.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
