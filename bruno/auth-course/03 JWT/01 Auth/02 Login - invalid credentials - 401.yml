info:
  name: 02 Login - invalid credentials - 401
  type: http
  seq: 2

http:
  method: POST
  url: "{{server}}/api/v1/auth/accessToken"
  body:
    type: json
    data: |-
      {
        "username": "user",
        "password": "wrong"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: expect(res.status).to.equal(401);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
