info:
  name: 03 Get customers - invalid token - 401
  type: http
  seq: 3

http:
  method: GET
  url: "{{server}}/api/v1/customer"
  headers:
    - name: Authorization
      value: Bearer invalid-token
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: expect(res.status).to.equal(401);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
