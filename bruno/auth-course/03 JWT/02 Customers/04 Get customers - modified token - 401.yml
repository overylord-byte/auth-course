info:
  name: 04 Get customers - modified token - 401
  type: http
  seq: 4

http:
  method: GET
  url: "{{server}}/api/v1/customer"
  headers:
    - name: Authorization
      value: Bearer {{modifiedJwtToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // This scenario is fully covered by backend integration tests.
        // To try it manually: take a valid token from login, replace the middle part (payload),
        // keep the original signature, and paste the result into {{modifiedJwtToken}}.
        expect(res.status).to.equal(401);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
